<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>المعرض | ديار للاستشارات الهندسية</title>
    <meta name="description" content="استعرض معرضًا مختارًا من المباني والفراغات المعمارية التي صممها فريق ديار." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <div class="scroll-progress"></div>
    <div class="cursor-dot" aria-hidden="true"></div>
    <div class="cursor-ring" aria-hidden="true"></div>

    <div data-nav></div>

    <main>
      <section class="page-hero section-shell reveal">
        <p class="eyebrow">المعرض</p>
        <h1>أماكن صُنعت بلمسة من الأناقة والهدف.</h1>
        <p>استعرض مجموعة مختارة من الفراغات الداخلية والمعالم العمرانية والبيئات المعمارية المنجزة.</p>
      </section>

      <section class="section-shell reveal">
        <div class="filter-row" id="gallery-filters"></div>
        <div id="gallery-grid" class="gallery-grid"></div>
      </section>
    </main>

    <div class="lightbox" id="lightbox" aria-hidden="true">
      <button class="lightbox-close" id="lightbox-close" aria-label="إغلاق المعرض">×</button>
      <button class="lightbox-nav" data-lightbox-prev aria-label="الصورة السابقة">←</button>
      <img id="lightbox-image" src="" alt="" />
      <button class="lightbox-nav" data-lightbox-next aria-label="الصورة التالية">→</button>
    </div>

    <footer data-footer></footer>

    <script src="js/data.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
